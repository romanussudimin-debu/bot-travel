<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Booking #{{ booking.id }} - Bot Travel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f9;color:#243247;font:14px Arial,sans-serif}
header{background:#172b4d;color:white;padding:24px max(20px,calc((100% - 900px)/2))}
header h1{margin:0 0 6px}
header p{margin:0;color:#d7dfeb}
main{max-width:900px;margin:22px auto;padding:0 16px}
.panel{background:white;border:1px solid #e1e7ef;border-radius:12px;padding:22px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
label{display:block;color:#526074;font-size:12px;margin-bottom:6px}
input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;background:white}
button,.btn{display:inline-block;border:0;border-radius:7px;padding:10px 14px;background:#2563eb;color:white;text-decoration:none;font-size:13px;font-weight:bold;cursor:pointer}
.btn.secondary{background:#e7edf5;color:#25364c}
.flash{padding:12px;margin-bottom:12px;border-radius:7px;background:#fff2cf}
.flash.success{background:#e4f6e9;color:#166534}
.flash.error{background:#fde8e8;color:#9b1c1c}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>Edit Booking #{{ booking.id }}</h1>
<p>Perbarui informasi pelanggan dan perjalanan.</p>
</header>

<main>
{% with messages=get_flashed_messages(with_categories=true) %}
{% for category,message in messages %}
<div class="flash {{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}

<section class="panel">
<h2>Informasi booking</h2>

<form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

<div class="grid">
<div>
<label for="nama_pelanggan">Nama pelanggan</label>
<input id="nama_pelanggan" name="nama_pelanggan" type="text"
maxlength="100" required value="{{ booking.nama_pelanggan }}">
</div>

<div>
<label for="tanggal_keberangkatan">Tanggal keberangkatan</label>
<input id="tanggal_keberangkatan" name="tanggal_keberangkatan"
type="date" required
value="{{ booking.tanggal_keberangkatan.strftime('%Y-%m-%d') if booking.tanggal_keberangkatan.strftime is defined else booking.tanggal_keberangkatan }}">
</div>

<div>
<label for="nama_paket">Nama paket wisata</label>
<input id="nama_paket" name="nama_paket" type="text"
maxlength="150" required value="{{ booking.nama_paket }}">
</div>

<div>
<label for="jumlah_peserta">Jumlah peserta</label>
<input id="jumlah_peserta" name="jumlah_peserta" type="number"
min="1" max="1000" required value="{{ booking.jumlah_peserta }}">
</div>

<div>
<label for="harga_per_orang">Harga per orang (Rp)</label>
<input id="harga_per_orang" name="harga_per_orang" type="number"
min="0" max="1000000000" required value="{{ booking.harga_per_orang }}">
</div>
</div>

<div class="actions">
<button type="submit">Simpan perubahan</button>
<a class="btn secondary" href="{{ url_for('detail_booking', booking_id=booking.id) }}">Batal</a>
<a class="btn secondary" href="{{ url_for('dashboard') }}">Kembali ke dashboard</a>
</div>
</form>
</section>
</main>
</body>
</html>
